# Galaxy Data Service specific configuration

server:
  port: 8083

spring:
  application:
    name: galaxy-data-service

  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/edcp_galaxy
    username: edcp_user
    password: edcp_pass
    hikari:
      maximum-pool-size: 30  # Higher pool for heavy read operations
      minimum-idle: 10

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis Cache configuration
  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes
      cache-null-values: false

  # RabbitMQ configuration for EDDN integration (Phase 2)
  rabbitmq:
    host: localhost
    port: 5672
    username: edcp_user
    password: edcp_pass

# Eureka client configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# API Gateway URL
api:
  gateway:
    url: http://localhost:8080

# Galaxy Data Service Development Environment Configuration

spring:
  jpa:
    show-sql: false  # Enable SQL logging in dev
    properties:
      hibernate:
        format_sql: false

  cache:
    redis:
      time-to-live: 300000  # 5 minutes cache in dev (shorter for testing)

# Enable detailed logging in dev
logging:
  level:
    com.edcp.galaxydataservice: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

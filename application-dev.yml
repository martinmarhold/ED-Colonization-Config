# Development environment configuration
# Override defaults for local development

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

# Database configuration for development
 # datasource:
 #   url: jdbc:postgresql://localhost:5432/edcp_${spring.application.name:default}
 #   username: edcp_user
 #   password: edcp_pass

# Redis configuration for development
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

# Eureka configuration for development
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Logging - More verbose in development
logging:
  level:
    root: INFO
    com.edcp: DEBUG
    org.springframework: INFO
    org.springframework.security: DEBUG
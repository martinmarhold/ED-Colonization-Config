# Production environment configuration
# Production-ready settings with security and performance optimizations

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

# Database configuration for production (use environment variables)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

# Redis configuration for production
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

# Eureka configuration for production
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${HOSTNAME:localhost}

# Logging - Less verbose in production
logging:
  level:
    root: WARN
    com.edcp: INFO
    org.springframework: WARN